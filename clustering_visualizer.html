async function exportReport() {
  if (!RUN) return;
  const btn = $("pdfBtn"), orig = btn.textContent;
  btn.disabled = true;

  _srcSeen = new Map(); _srcN = 0;     // one image registry per report
  const saved = { map: state.map, az: nv.scene.renderAzimuth, el: nv.scene.renderElevation,
                  elec: state.showElec, glass: state.glass };

  // FROZEN SETTINGS. Everything in the report is rendered with the values that were
  // live when Save was pressed — the colour ceiling above all.
  //
  // This used to call autoScale() once per cluster, which re-derived the ceiling from
  // that cluster's own 98th percentile. A cluster covering a little cortex at low
  // probability then got a low ceiling and rendered just as bright as a cluster
  // covering half the brain at high probability. The panels looked comparable and
  // were not. One ceiling across every panel is what makes them comparable.
  const frozen = {
    climMax: state.climMax, autoScaled: state.autoScaled,
    minN: state.minN, gamma: state.gamma, radius: state.radius,
    surf: state.surf, map: state.map, glass: state.glass,
  };
  // Was the frozen ceiling the auto-derived one or set by hand? The report says which,
  // because "0.35" means a different thing in the two cases.
  const climSource = (Math.abs(frozen.climMax - frozen.autoScaled) < 1e-9 && frozen.autoScaled > 0)
    ? `auto — 98th percentile of the “${frozen.map}” map, frozen at save`
    : `set by hand`;

  const runBase = `${CLUST}${RUN.path}/`;
  const CAPW = 900, FIGW = 1500;

  try {
    REPORT_LIGHT.on = true;          // white backdrop + lighter cortex, capture only
    applyOpacity();
    state.showElec = false; updateElectrodes();

    const clusterDefs = DEFS.filter(d => d.cluster !== undefined);
    // empty at the run's own K, so the published artifacts are used unchanged
    // lf_centroids writes k_5 .. k_23 with NO zero padding. Padding to k_05 here
    // silently 404s for every K under 10 - the K panel showed chips at 10, 11 and 12 and
    // nothing below, which looked like missing data and was a mis-built path.
    const kDir = (Number(KSEL) === Number(RUN0.k)) ? "" : `k_${KSEL}/`;
    const pcol = patientColorMap(Object.keys(RUN.patient_totals || {}));
    // same palette the glass view paints contacts with - not a parallel one
    const clusterHue = (i) => clusterCSS(RUN.clusters[i]);

    // ── coverage
    btn.textContent = "Report: coverage…";
    // no autoScale() here: the frozen ceiling applies to coverage too
    state.map = "coverage"; $("mapSel").value = "coverage";
    state.climMax = frozen.climMax;
    const covStats = render(); await sleep(60);
    const covShots = [];
    for (const [az, el] of VIEWS) covShots.push(await captureView(az, el, CAPW, true));
    btn.textContent = "Report: coverage rotation...";
    const covSpin = await captureSpin(0, SPIN_N, SPIN_W, true);
    // contact density = the same cohort with every contact drawn, so the reader can
    // see where the electrodes actually are, not only where the coverage mask says
    // something is estimable.
    btn.textContent = "Report: contact density...";
    state.showElec = true; state.elecByCluster = false; updateElectrodes();
    const densSpin = await captureSpin(0, SPIN_N, SPIN_W, true);
    state.showElec = false; updateElectrodes();
    const covMax = frozen.climMax;

    // ── per cluster
    const blocks = [];
    for (let i = 0; i < clusterDefs.length; i++) {
      const d = clusterDefs[i];
      btn.textContent = `Report: cluster ${i + 1}/${clusterDefs.length}…`;
      // every cluster is drawn on the SAME frozen ceiling, so the panels compare
      state.map = d.id; $("mapSel").value = d.id;
      state.climMax = frozen.climMax; state.minN = frozen.minN; state.gamma = frozen.gamma;
      const st = render(); await sleep(80);
      const shots = [];
      for (const [az, el] of VIEWS) shots.push(await captureView(az, el, CAPW, true));
      const spinFrames = await captureSpin(0, SPIN_N, SPIN_W, true);
      const fig = (RUN.figures.per_cluster || {})[String(d.cluster)] || {};
      // CENTROIDS MUST FOLLOW K. fig.centroid points at cluster_centroids/cluster_NN.png,
      // which is the PUBLISHED cut. Exporting at any other K used it anyway, so a K=11
      // report showed K=6's centroids for clusters 0-5 under K=11 headings and "not
      // published" for 6-10 - wrong rather than merely missing, and the k_11/ chips were
      // sitting there unused. At a re-cut K the k_NN/ folder is the only correct source
      // and there is deliberately NO fallback to the flat chips.
      const cc = String(d.cluster).padStart(2, "0");
      const centroid = kDir
        ? await tryImage(`${runBase}cluster_centroids/${kDir}cluster_${cc}.png`, FIGW, false)
        : (fig.centroid ? await tryImage(runBase + fig.centroid, FIGW, false)
                        : { data: "", w: 0, h: 0 });
      // make_centroid_rasters only writes the published cut. Rather than show that cut's
      // raster beside another cut's centroid, try a per-K folder and otherwise show none.
      const raster = kDir
        ? await tryImage(`${runBase}cluster_rasters/${kDir}cluster_${cc}.png`, FIGW, false)
        : await tryImage(`${runBase}cluster_rasters/cluster_${cc}.png`, FIGW, false);
      blocks.push({ d, st, shots, centroid, raster, spinFrames,
                    climMax: frozen.climMax });
    }

    // ── per-cluster glass stills, captured from this page
    // ONE surface swap for the whole set. Entering glass mode reloads the pial mesh
    // with a uniform rgba255, so doing it per cluster would add K reloads to an
    // already slow export. Only the map changes inside the loop - which is precisely
    // what now makes each still show its own cluster, rather than all of them.
    let glassCovSpin = null;
    const KBRAINS = {};   // k -> [ [3 glass stills] per cluster ]
    const glassWas = { glass: state.glass, byCluster: state.elecByCluster,
                       elec: state.showElec };
    try {
      if (!state.glass) {
        btn.textContent = "Report: glass surface…";
        state.glass = true; state.surf = "pial";
        await loadSurface("pial", GLASS_RGBA);
        applyOpacity();
      }
      state.showElec = true; state.elecByCluster = true;
      // ONE CROP BOX PER VIEW, measured once and reused for every cluster. Cropping
      // each still to its own ink would frame each cluster differently - a tight
      // cluster would fill its panel and a spread one would shrink - and the panels
      // would stop being comparable, which is the entire point of freezing the
      // settings. The brain silhouette is identical across clusters, so one box is
      // the correct box. Measured on the coverage map, where every contact is drawn.
      state.map = "coverage"; $("mapSel").value = "coverage";
      render(); updateElectrodes(); await sleep(60);
      // Measured here, on coverage, where every contact in the cohort is drawn - so the
      // box bounds the whole set and no cluster can fall outside it.
      btn.textContent = "Report: glass rotation box...";
      const gSpinBox = await probeSpinBox(0, 8, true);
      btn.textContent = "Report: glass coverage rotation...";
      glassCovSpin = await captureSpin(0, SPIN_N, SPIN_W, true, gSpinBox);
      const gBox = [];
      for (const [az, el] of VIEWS) {
        gBox.push(await new Promise(r => {
          try { nv.scene.renderAzimuth = az; nv.scene.renderElevation = el; } catch (e) {}
          requestAnimationFrame(() => {
            try { nv.drawScene(); } catch (e) {}
            const b = inkBox(canvasEl, true);
            const pad = 10;
            r(b ? { x: Math.max(0, b.x - pad), y: Math.max(0, b.y - pad),
                    w: Math.min(canvasEl.width,  b.w + 2 * pad),
                    h: Math.min(canvasEl.height, b.h + 2 * pad) } : null);
          });
        }));
      }
      for (let i = 0; i < blocks.length; i++) {
        btn.textContent = `Report: glass ${i + 1}/${blocks.length}…`;
        state.map = blocks[i].d.id; $("mapSel").value = blocks[i].d.id;
        render(); updateElectrodes(); await sleep(60);
        const gs = [];
        // onWhite: the glass backdrop is white, so both the crop and the fill invert
        for (let v = 0; v < VIEWS.length; v++) {
          const [az, el] = VIEWS[v];
          gs.push(gBox[v] ? await captureRaw(az, el, CAPW, gBox[v], true)
                          : await captureView(az, el, CAPW, true));
        }
        blocks[i].glassShots = gs;
        // The 360 comes from here too, rather than being fetched from the repo. It costs
        // no extra frames - it replaces the offline rotation the report used to pull -
        // and it means a run that was never rendered offline still turns.
        btn.textContent = `Report: glass rotation ${i + 1}/${blocks.length}...`;
        blocks[i].glassSpin = await captureSpin(0, SPIN_N, SPIN_W, true, gSpinBox);
      }

      // ── EVERY CLUSTER AT EVERY K, captured while the glass surface is already up.
      // The K panel could switch its numbers and centroid chips but not its brains, so
      // pressing a button changed the table and left the cortex showing another cut.
      // Done here rather than in its own pass because entering glass mode reloads the
      // pial mesh: one swap for all of it instead of one per K.
      //
      // Stills only. A 60-frame turn for each of these clusters would be roughly 8600
      // more frames and a third of a gigabyte, which no browser will open.
      if (SWEEP && SWEEP.ks && SWEEP.ks.length > 1) {
        const kWas = KSEL;
        for (const kk of SWEEP.ks) {
          btn.textContent = `Report: K=${kk} brains…`;
          await applyK(kk);
          refreshMapList();
          const ids = (SWEEP.stats[String(kk)] || {}).clusters || [];
          const shots = [];
          for (const c of ids) {
            state.map = `c${c}`;
            if (!DEFS.some(d => d.id === state.map)) { shots.push(null); continue; }
            state.climMax = frozen.climMax; state.minN = frozen.minN; state.gamma = frozen.gamma;
            render(); updateElectrodes(); await sleep(60);
            const one = [];
            for (let v = 0; v < VIEWS.length; v++) {
              const [az, el] = VIEWS[v];
              contactsHemi(HEMI_FOR_VIEW[v]);
              await sleep(40);
              one.push(gBox[v] ? await captureRaw(az, el, CAPW, gBox[v], true)
                               : await captureView(az, el, CAPW, true));
            }
            contactsHemi("both");
            shots.push(one);
          }
          KBRAINS[kk] = shots;
        }
        await applyK(kWas);
        refreshMapList();
      }
    } catch (e) {
      // A failed glass pass must not cost the report the work already captured.
      console.warn("glass pass failed:", e);
    } finally {
      contactsHemi("both");  // a pass that failed mid-view must not leave dots missing
      state.glass = glassWas.glass; state.elecByCluster = glassWas.byCluster;
      state.showElec = glassWas.elec; state.surf = frozen.surf;
      // Always reload: leaving a uniform-rgba255 mesh behind under a non-glass state
      // is the one way this pass could damage what the user sees afterwards.
      await loadSurface(frozen.surf, glassWas.glass ? GLASS_RGBA : undefined);
      applyOpacity();
    }

    // ── whole-run figures
    // cluster_cards.png is the offline version of the section built above: same idea,
    // the superseded layout, and 252's renders rather than this viewer's. Carrying both
    // put two different answers to one question in one report.
    const ov = (RUN.figures.overview || [])
      .filter(f => !/(^|\/)cluster_cards\.png$/.test(String(f.path || "")));
    const ovImgs = [];
    for (let i = 0; i < ov.length; i++) {
      btn.textContent = `Report: figure ${i + 1}/${ov.length}…`;
      ovImgs.push(await tryImage(runBase + ov[i].path, FIGW, false));
    }

    // ── assemble -------------------------------------------------------------
    btn.textContent = "Report: writing…";
    // named once: the report's own download and the notes copy must agree
    const reportName = `report_${RUN.track.replace(/\//g, "_")}_${RUN.run}`
                     + `_K${KSEL}_r${frozen.radius}mm_n${frozen.minN}`
                     + `_max${frozen.climMax.toFixed(2)}.html`;
    const K = RUN.clusters.length;
    const sizeItems = RUN.clusters.map((k, i) => ({
      label: `Cluster ${k}`, value: RUN.cluster_sizes[String(k)], color: clusterHue(i) }));
    const patTotals = RUN.patient_totals || {};
    const patItems = Object.keys(patTotals).sort()
      .map(p => ({ label: p, value: patTotals[p], color: pcol[p] || "#888" }));
    const nSamples = RUN.n_samples_with_cluster;

    const summary = `<table class="sum"><thead><tr><th>Cluster</th><th>samples</th><th>share</th>` +
      `<th>patients</th><th>of cohort</th><th>top patient</th></tr></thead><tbody>` +
      RUN.clusters.map((k, i) => {
        const comp = (RUN.cluster_patient_counts || {})[String(k)] || {};
        const tot = Object.values(comp).reduce((s, v) => s + v, 0) || 1;
        const top = Object.entries(comp).sort((a, b) => b[1] - a[1])[0];
        const np = RUN.cluster_patients[String(k)];
        return `<tr><td class="sw"><i style="background:${clusterHue(i)}"></i>Cluster ${k}</td>` +
               `<td>${RUN.cluster_sizes[String(k)]}</td><td>${(100 * RUN.cluster_sizes[String(k)] / nSamples).toFixed(1)}%</td>` +
               `<td>${np}</td><td>${(100 * np / COH.n_patients).toFixed(0)}%</td>` +
               `<td>${top ? esc(top[0]) + " (" + (100 * top[1] / tot).toFixed(0) + "%)" : "—"}</td></tr>`;
      }).join("") + `</tbody></table>`;

    // ── overall run statistics -------------------------------------------
    const szVals = RUN.clusters.map(k => RUN.cluster_sizes[String(k)]);
    const npVals = RUN.clusters.map(k => RUN.cluster_patients[String(k)]);
    const maxI = szVals.indexOf(Math.max(...szVals));
    const minI = szVals.indexOf(Math.min(...szVals));
    const med = a => { const b = [...a].sort((x, y) => x - y), m = b.length >> 1;
                       return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
    // The single most patient-concentrated cluster in the run. This is the number
    // that decides whether a cluster can be read as a population effect at all, so
    // it belongs at the top rather than buried in the per-cluster sections.
    let conc = { k: null, share: 0 };
    for (const k of RUN.clusters) {
      const comp = (RUN.cluster_patient_counts || {})[String(k)] || {};
      const tot = Object.values(comp).reduce((a, v) => a + v, 0) || 1;
      const top = Object.values(comp).length ? Math.max(...Object.values(comp)) : 0;
      if (top / tot > conc.share) conc = { k, share: top / tot };
    }
    const tile = (v, lab) => `<div class="rs"><b>${v}</b><span>${lab}</span></div>`;
    const runStats = `<div class="runstats">
      ${tile(K, "clusters")}
      ${tile(nSamples, "labelled samples")}
      ${tile(RUN.n_electrodes, esc(RUN.unit) + " rows")}
      ${tile(RUN.n_contacts_with_cluster, "contacts localised")}
      ${tile(patItems.length + " / " + COH.n_patients, "patients contributing")}
      ${RUN.n_electrodes_multilabel ? tile(RUN.n_electrodes_multilabel, "multi-label rows") : ""}
      ${tile((100 * szVals[maxI] / nSamples).toFixed(0) + "%", "largest cluster (c" + RUN.clusters[maxI] + ")")}
      ${tile((100 * szVals[minI] / nSamples).toFixed(0) + "%", "smallest cluster (c" + RUN.clusters[minI] + ")")}
      ${tile(med(npVals), "median patients per cluster")}
      ${conc.k !== null ? tile((100 * conc.share).toFixed(0) + "%",
          "most one-patient-heavy (c" + conc.k + ")") : ""}
    </div>`;

    // ── cluster cards ------------------------------------------------------
    // Built here, from what this viewer captured a moment ago - not fetched. Every
    // brain in this grid is the live glass scene at the frozen settings, so a run
    // that 252 never rendered still gets a full set of cards.
    let cardFallback = false;
    // One x axis in samples for every composition bar. Taken from the same quantity the
    // bars are built from (the per-patient counts), not cluster_sizes - the two can
    // differ by unlabelled rows, and an axis that does not match its bars is worse than
    // no axis.
    const compTot = k => Object.values((RUN.cluster_patient_counts || {})[String(k)] || {})
                               .reduce((a, v) => a + v, 0);
    const barMax = Math.max(1, ...RUN.clusters.map(compTot));
    const cardsRows = blocks.map(({ d, shots, glassShots, centroid }, i) => {
      const k = d.cluster;
      const comp = (RUN.cluster_patient_counts || {})[String(k)] || {};
      const tot = Object.values(comp).reduce((a, v) => a + v, 0);
      const items = Object.keys(comp).sort()
        .map(q => ({ label: q, value: comp[q], color: pcol[q] || "#888" }));
      const top = Object.entries(comp).sort((a, b) => b[1] - a[1])[0];
      const cells = VIEWS.map((v, j) => {
        const g = (glassShots || [])[j];
        const use = (g && g.data) ? g : shots[j];
        if (!(g && g.data)) cardFallback = true;
        return cellImg(use, v[2]);
      }).join("");
      return `<div class="cardrow">
        <div class="kchip" style="background:${clusterHue(i)}">c${k}</div>
        ${cellImg(centroid, "centroid")}
        ${cells}
        <div><div class="sbtrack">${stackbar(items, tot, 15, barMax)}</div>
          <div class="sbcap">${tot} samples · ${RUN.cluster_patients[String(k)]} patients${
            top ? " · " + esc(top[0]) + " " + (100 * top[1] / (tot || 1)).toFixed(0) + "%" : ""}</div>
        </div>
      </div>`;
    }).join("");

    // ── cluster cards ─────────────────────────────────────────────────────
    // Dropped where the run has a K sweep: the K panel now draws exactly this row - chip,
    // centroid, three views, composition, same grid, same shared axis - once per K, and
    // one of those K IS the exported cut. Keeping both put the same table twice in one
    // report, differing only in that the cards could not follow the K buttons.
    //
    // Still built for a run WITHOUT a sweep. There is no K panel on those, so removing it
    // unconditionally would take the per-cluster overview away from them entirely rather
    // than de-duplicate it.
    const hasSweep = !!(SWEEP && SWEEP.ks && SWEEP.ks.length > 1);
    const cardsHTML = hasSweep ? "" : `<section class="card">
  <h2 class="sec">Cluster cards</h2>
  <p class="sechint">One row per cluster: its mean response, the same three angles for every
    cluster, and who it is made of. The brains are the contacts themselves on a glass brain,
    captured from this viewer at the frozen settings${cardFallback
      ? " &mdash; except where the glass pass did not complete, which falls back to the probability map"
      : ""}, so nothing here depends on a run having been rendered offline.
    The composition bars share one x axis in samples, so a longer bar is a bigger
    cluster and the segments inside it are the patients it came from &mdash; length and
    composition are readable in the same glance.</p>
  <div class="cardhead"><div></div><div>centroid</div>
    ${VIEWS.map(v => `<div>${esc(v[2])}</div>`).join("")}<div>who is in it · samples</div></div>
  <div class="cards">${cardsRows}</div>
  <div class="cardaxis"><div></div><div></div><div></div><div></div><div></div>
    <div class="baxis"><span>0</span><span>${Math.round(barMax / 2)}</span><span>${barMax}</span></div>
  </div>
</section>`;

    // ── the K panel -----------------------------------------------------------
    // Everything here was computed by the notebooks and is only READ. A saved report
    // cannot refit, so each K shows what already exists on disk for that cut and says so
    // plainly when something has not been produced yet. The brains are NOT switched:
    // they are captures of one cut, and per-K renders do not exist.
    btn.textContent = "Report: K panel…";
    const KP = { ks: [], byK: {}, pub: Number(RUN0.k) };
    if (SWEEP && SWEEP.ks && SWEEP.ks.length > 1) {
      KP.ks = SWEEP.ks.slice();
      const sweepMetrics = await tryCSV(runBase + "sweep_metrics.csv");   // k-means / Ward
      const sweepCnmf    = await tryCSV(runBase + "sweep_by_k.csv");      // convex NMF
      const stabByK      = await tryCSV(runBase + "stability_by_k.csv");
      const pick = (rows, k) => (rows || []).find(r => Number(r.k) === k);

      for (const k of KP.ks) {
        btn.textContent = `Report: K panel ${k}…`;
        const st = SWEEP.stats[String(k)] || {};
        const ids = st.clusters || [];
        // centroid chips for this cut, if make_missing_centroids has drawn them
        const chips = await Promise.all(ids.map(c =>
          tryImage(`${runBase}cluster_centroids/k_${k}/`
                   + `cluster_${String(c).padStart(2, "0")}.png`, 320, false)));
        KP.byK[k] = {
          stats: st,
          metrics: pick(sweepMetrics, k) || null,
          cnmf: pick(sweepCnmf, k) || null,
          stability: pick(stabByK, k) || null,
          chips: chips.filter(x => x && x.data),
          nChips: chips.filter(x => x && x.data).length,
          nClusters: ids.length,
          brains: KBRAINS[k] || null,
          ids,
        };
      }
    }

    // ── results ------------------------------------------------------------
    // Read from the run's own files rather than restated, so a number here cannot drift
    // from the analysis that produced it. Each row carries how to read it, because a
    // silhouette of 0.16 means something quite different on iEEG responses than the
    // textbook reading of "weak structure" suggests.
    btn.textContent = "Report: results…";
    const method = String(RUN.track || "").split("/")[0];
    const fset   = String(RUN.track || "").split("/")[1] || "";
    // AT THE K THIS REPORT WAS EXPORTED AT, not at the run's published K. metrics.json
    // and stability_summary.json describe the published cut only; quoting them under a
    // re-cut heading is a number silently changing meaning, which is the whole reason
    // the per-K files exist. At a re-cut K they are ignored and the sweep files are read
    // instead; where a sweep file is absent the row is simply not shown.
    const atPub = Number(KSEL) === Number(RUN0.k);
    const swM = await tryCSV(runBase + "sweep_metrics.csv");
    const swC = await tryCSV(runBase + "sweep_by_k.csv");
    const swS = await tryCSV(runBase + "stability_by_k.csv");
    const atK = rows => (rows || []).find(x => Number(x.k) === Number(KSEL)) || null;
    const mK = atK(swM), cK = atK(swC), sK = atK(swS);
    const RES = {
      metrics:   atPub ? await tryJSON(runBase + "metrics.json") : null,
      stability: atPub ? await tryJSON(runBase + "stability_summary.json") : null,
      decomp:    (atPub && method === "cnmf")
                 ? await tryJSON(`${CLUST}decomposition/${fset}/meta.json`) : null,
      // sweep rows, used at any K - and preferred over the published files when both
      // exist, so the table cannot disagree with the K panel above it
      swMetrics: mK, swCnmf: cK, swStab: sK, atPub,
      // Written by make_cluster_statistics.py into the run directory. It is valid ONLY
      // at the K it was computed at, and it carries that K itself - so it is gated on
      // its own K below rather than on atPub, which tracks the run's PUBLISHED cut.
      stats: await tryJSON(runBase + "cluster_statistics.json"),
    };
    const rows = [];
    const add = (name, val, how) => {
      if (val === null || val === undefined || (typeof val === "number" && !isFinite(val))) return;
      // The "at K=" tag is markup and the label is not, so escape the label and append
      // the tag afterwards rather than escaping the two together.
      let lab = String(name), tag = "";
      if (lab.endsWith("␟ATK")) {
        lab = lab.slice(0, -4);
        tag = ` <span class="atk">at K=${KSEL}</span>`;
      }
      rows.push(`<tr><td>${esc(lab)}${tag}</td><td class="rv">${esc(String(val))}</td>`
              + `<td>${how}</td></tr>`);
    };
    const f3 = v => (v === null || v === undefined) ? null : (+v).toFixed(3);
    const pc = v => (v === null || v === undefined) ? null : (100 * v).toFixed(1) + "%";

    const AT = "␟ATK";   // marker, expanded inside add() - the label is escaped
    if (RES.swMetrics) {
      add("Silhouette, overall" + AT, f3(RES.swMetrics.silhouette),
        "&minus;1 to +1: how much closer a sample sits to its own cluster than to the next one. " +
        "On iEEG responses 0.1–0.2 is the normal range and means broad, overlapping " +
        "populations rather than crisp types &mdash; it is not a failed fit.");
      add("Calinski–Harabasz" + AT,
        RES.swMetrics.calinski_harabasz === undefined ? null
          : (+RES.swMetrics.calinski_harabasz).toFixed(1),
        "Between-cluster spread divided by within-cluster spread. Higher is tighter, but it " +
        "climbs with K on its own, so only compare runs fitted at the same K.");
      add("Davies–Bouldin" + AT, f3(RES.swMetrics.davies_bouldin),
        "How similar each cluster is to whichever one most resembles it, averaged. Lower is " +
        "better; below about 1 counts as well separated.");
    } else if (RES.metrics) {
      add("Silhouette, overall", f3(RES.metrics.silhouette_overall),
        "−1 to +1: how much closer a sample sits to its own cluster than to the next one. " +
        "On iEEG responses 0.1–0.2 is the normal range and means broad, overlapping " +
        "populations rather than crisp types &mdash; it is not a failed fit.");
      add("Calinski–Harabasz", RES.metrics.calinski_harabasz === undefined ? null
            : (+RES.metrics.calinski_harabasz).toFixed(1),
        "Between-cluster spread divided by within-cluster spread. Higher is tighter, but it " +
        "climbs with K on its own, so only compare runs fitted at the same K.");
      add("Davies–Bouldin", f3(RES.metrics.davies_bouldin),
        "How similar each cluster is to whichever one most resembles it, averaged. Lower is " +
        "better; below about 1 counts as well separated.");
    }
    if (RES.swStab) {
      add("Stability, mean" + AT, f3(RES.swStab.mean_jaccard),
        `Refit ${RES.swStab.n_runs} times on ${pc(RES.swStab.subsample_frac)} of the samples ` +
        "and matched back. 1.0 is an identical partition every time; around " +
        "0.3–0.4 means it moves substantially when the sample changes.");
      add("Stability, worst cluster" + AT, f3(RES.swStab.min_jaccard),
        "The least reproducible single cluster at this K.");
    } else if (RES.stability) {
      add("Stability, mean", f3(RES.stability.mean_jaccard),
        `Refit ${RES.stability.n_runs} times on ${pc(RES.stability.subsample_frac)} of the samples ` +
        "and matched back to the full fit. 1.0 is an identical partition every time; around " +
        "0.3–0.4 means it moves substantially when the sample changes.");
      add("Stability, worst cluster", f3(RES.stability.min_jaccard),
        "The least reproducible single cluster. A run can be stable on average and still carry " +
        "one cluster that does not survive resampling, so check this before quoting a cluster " +
        "on its own.");
    }
    if (RES.swCnmf) {
      add("Variance explained" + AT, f3(RES.swCnmf.var_explained),
        "How much of the dB response matrix the components rebuild at this K. In sample, " +
        "so it can only rise with a better fit &mdash; and on this run it does not rise " +
        "monotonically, which says the higher cuts land in poorer optima.");

        RES.swCnmf.frac_no_majority === undefined ? null

        "Electrodes where a single component carries most of the weight. Low is expected here: " +
        "a graded model is not trying to assign each electrode to one type.");
      add("No majority component", pc(mx.frac_no_majority),
        "Electrodes whose weight is spread across components with none above half. This is the " +
        "result the graded model exists to express, and the reason a hard partition of the same " +
        "data is a summary rather than a description.");
      add("Median top weight", f3(mx.median_top_weight),
        "The typical electrode's strongest component weight. Near 1/K would mean components are " +
        "not differentiating electrodes at all.");
      const asc = RES.decomp.argmax_spatial_coherence;
      if (Array.isArray(asc) && asc.length > 1)
        add("Anatomical coherence", (+asc[1]).toFixed(2) + "× chance",
          "How much more often neighbouring electrodes share a component than they would if " +
          "components were shuffled. Above 1 means the decomposition tracks anatomy it was " +
          "never given.");

          `Silhouette in this method's home space (<b>${esc(sp.space)}</b>), against a null ` +
          `carrying this feature set's own covariance &mdash; correlated features, smooth time ` +
          `courses, one blob, no cluster structure &mdash; refitted by the same method ` +
          `${sp.n_null} times. White noise would be trivially beatable and would prove nothing. ` +
          `z is how many null standard deviations the real partition sits above it.`);

            `not space-free: convex NMF unit-norms each electrode before fitting while k-means ` +

  radius ${frozen.radius} mm · gate n ≥ ${frozen.minN} · ${esc(frozen.surf)} surface ·
  colour ceiling ${frozen.climMax.toFixed(2)} (${esc(climSource)}) · gamma ${frozen.gamma.toFixed(2)}.<br>
  Patient colours match the MOBA patient view. Print this page (A4 landscape) to get a PDF.
</footer>
<div class="notebar">
  <button id="saveNotes" type="button">Download copy with notes</button>
  <span>Typing is kept in this browser only. Use this to write the notes into a file you can send.</span>
</div>
<script id="baked-notes" type="application/json">{}<\/script>
</div>${MIRROR_JS}${SPIN_JS}${KPICK_JS}${NOTES_JS}</body></html>`;

    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    // the ceiling and gate are in the filename: two reports of the same run at
    // different settings are different documents and must not overwrite each other
    a.download = reportName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  } catch (e) {
    console.error(e);
    alert("Report export failed: " + e.message);
  } finally {
    REPORT_LIGHT.on = false;         // the page goes back to its dark look
    state.map = saved.map; $("mapSel").value = saved.map;
    state.showElec = saved.elec; state.glass = saved.glass;
    try { nv.scene.renderAzimuth = saved.az; nv.scene.renderElevation = saved.el; } catch (e) {}
    // Put the ceiling back where the user left it rather than re-deriving it: they
    // chose that number, and a report run should not silently move their slider.
    state.climMax = frozen.climMax; state.autoScaled = frozen.autoScaled;
    state.minN = frozen.minN; state.gamma = frozen.gamma;
    $("clim").value = Math.round(frozen.climMax * 100);
    $("climVal").textContent = frozen.climMax.toFixed(2);
    render(); applyOpacity(); updateElectrodes();
    btn.textContent = orig; btn.disabled = false;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
function wireUI() {
  $("runSel").onchange = e => selectRun(e.target.value);
  $("mapSel").onchange = e => { state.map = e.target.value; autoScale(); render(); updateElectrodes(); };

  const setSurfBtns = () => {
    $("sPial").classList.toggle("on", state.surf === "pial" && !state.glass);
    $("sInfl").classList.toggle("on", state.surf === "inflated" && !state.glass);
    $("sGlass").classList.toggle("on", state.glass);
  };
  const surfBtn2 = (kind) => async () => {
    if (state.surf === kind && !state.glass) return;
    const wasGlass = state.glass;
    state.glass = false; state.surf = kind; setSurfBtns();
    if (wasGlass) { state.elecByCluster = false; state.showElec = $("showElec").checked; }
    $("status").style.display = "grid"; $("status").textContent = "Loading surface…";
    await loadSurface(kind);        // no uniform colour: render() repaints per vertex
    $("status").style.display = "none";
    render(); applyOpacity(); updateElectrodes();
  };
  $("sPial").onclick = surfBtn2("pial");
  $("sInfl").onclick = surfBtn2("inflated");

  // GLASS = pial + alpha 0.18 + white backdrop + one flat surface colour + contacts
  // coloured by cluster. Not a third mesh: a way of DRAWING the pial one, so that a
  // screenshot from this page can stand in for a rendered glass brain.
  $("sGlass").onclick = async () => {
    if (state.glass) return;
    state.glass = true; setSurfBtns();
    $("status").style.display = "grid"; $("status").textContent = "Loading surface…";
    state.surf = "pial";
    // always reload: the mesh has to come back with a UNIFORM rgba255 rather than the
    // per-vertex buffer render() leaves behind, or the alpha is ignored
    await loadSurface("pial", GLASS_RGBA);
    $("status").style.display = "none";
    state.showElec = true; state.elecByCluster = true;
    $("showElec").checked = true;      // the mode forces it; say so in the UI
    render(); applyOpacity(); updateElectrodes();
  };

  $("showElec").onchange = e => { state.showElec = e.target.checked; updateElectrodes(); };
  $("showGate").onchange = e => { state.gate = e.target.checked; render(); };
  $("minN").oninput  = e => { state.minN = +e.target.value; $("minNVal").textContent = state.minN; render(); };
  $("minLoad").oninput = e => {
    state.minLoad = +e.target.value / 100;
    $("minLoadVal").textContent = state.minLoad.toFixed(2);
    updateElectrodes();
  };
  $("radSel").onchange = async e => {
    state.radius = e.target.value;
    $("status").style.display = "grid"; $("status").textContent = `Recomputing at ${state.radius} mm…`;
    await selectRun(RUN.id, true);      // reloads at the new radius, keeping K
  };
  $("clim").oninput  = e => { state.climMax = +e.target.value / 100; $("climVal").textContent = state.climMax.toFixed(2); render(); };
  $("gamma").oninput = e => { state.gamma = +e.target.value / 100; $("gammaVal").textContent = state.gamma.toFixed(2); render(); };
  $("pdfBtn").onclick = exportReport;

  const toggleCtl = () => {
    const c = $("controls"); c.classList.toggle("collapsed");
    $("ctlChevron").textContent = c.classList.contains("collapsed") ? "▸" : "▾";
  };
  $("ctlHead").onclick = toggleCtl;
  window.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "h") document.querySelectorAll(".panel").forEach(p => p.classList.toggle("hidden"));
    else if (e.key === "c") toggleCtl();
  });
}

boot().catch(e => { $("status").textContent = "Failed to load: " + e.message; console.error(e); });
</script>
</body>
