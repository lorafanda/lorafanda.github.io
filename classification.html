<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classification Results — Lora Fanda (DRAFT)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0ebe4; --surface: #e8e0d8; --surface2: #dfd6cc; --surface3: #d5ccc2;
      --text: #3a2e2a; --muted: #7a6560;
      --accent: #b85c6e; --accent2: #c47a5a; --accent3: #7a8c6e;
      --good: #5e7d5e; --warn: #c47a5a; --bad: #b85c6e;
      --border: rgba(90,60,50,0.10); --border-strong: rgba(90,60,50,0.18);
      --nav-h: 56px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Instrument Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; }

    .topbar { height: var(--nav-h); display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem;
      background: rgba(240,235,228,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50; }
    .topbar .brand { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.04em; }
    .topbar .brand .sub { color: var(--muted); font-style: italic; font-weight: 400; font-size: 0.85rem; margin-left: 0.4rem; }
    .topbar .draft-badge { background: var(--accent); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.1em; }
    .topbar select { padding: 6px 10px; font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; min-width: 300px; cursor: pointer; }
    .topbar a.back, .topbar a.guide { font-size: 0.78rem; color: var(--muted); text-decoration: none; letter-spacing: 0.04em; }
    .topbar a.back:hover, .topbar a.guide:hover { color: var(--text); }
    .topbar .spacer { flex: 1; }

    main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.25rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 950px) { main { grid-template-columns: 1fr; } }
    section.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; align-self: start; }
    section.panel.span2 { grid-column: 1 / -1; }
    section.panel h2 { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 0.9rem 1.5rem;
      cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0.55rem; border-bottom: 1px solid var(--border); }
    section.panel h2 .chev { font-size: 0.75rem; transition: transform 0.2s; color: var(--muted); }
    section.panel h2 .step { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; background: var(--surface2); color: var(--muted); border-radius: 4px; padding: 1px 7px; }
    section.panel.collapsed h2 { border-bottom: none; }
    section.panel.collapsed h2 .chev { transform: rotate(-90deg); }
    section.panel .body { padding: 1.25rem 1.5rem; }
    section.panel.collapsed .body { display: none; }
    .lead { font-size: 0.88rem; color: var(--text); margin: 0 0 1rem; }
    .lead em { color: var(--muted); }

    /* Verdict */
    .verdict-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 1rem; align-items: stretch; }
    @media (max-width: 800px){ .verdict-grid { grid-template-columns: 1fr 1fr; } }
    .vtile { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1.1rem; }
    .vtile .vlabel { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }
    .vtile .vbig { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 500; line-height: 1.15; margin-top: 0.2rem; }
    .vtile .vsub { font-size: 0.74rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 0.15rem; }
    .vbig.good { color: var(--good); } .vbig.warn { color: var(--warn); } .vbig.bad { color: var(--bad); }
    .verdict-line { font-size: 0.92rem; margin: 0 0 1rem; }
    .verdict-line .primary-badge { background: var(--accent3); color: #fff; font-size: 0.62rem; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 4px; margin-left: 0.5rem; vertical-align: middle; }
    .secondary { font-size: 0.78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 0.9rem; }

    /* Bars vs chance (triad + robustness) */
    .bar-row { display: grid; grid-template-columns: 150px 1fr 86px; align-items: center; gap: 0.6rem; margin: 0.3rem 0; font-size: 0.78rem; }
    .bar-row .blab { font-family: 'JetBrains Mono', monospace; color: var(--text); }
    .bar-row .blab.primary { font-weight: 600; }
    .bar-track { position: relative; height: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .bar-track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent3); opacity: 0.85; }
    .bar-track .fill.warn { background: var(--warn); } .bar-track .fill.bad { background: var(--muted); opacity: 0.5; }
    .bar-track .chance { position: absolute; top: -1px; bottom: -1px; width: 0; border-left: 2px dashed var(--accent); }
    .bar-row .bval { font-family: 'JetBrains Mono', monospace; text-align: right; color: var(--muted); }
    .bar-row .bval b { color: var(--text); }
    .triad-block { margin-bottom: 1rem; }
    .triad-block .tt { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }

    /* Confusion */
    .cm-axis { font-style: italic; color: var(--muted); font-size: 0.76rem; text-align: center; margin: 0.1rem 0 0.4rem; }
    .cm-table { border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; margin: 0 auto; }
    .cm-table th, .cm-table td { padding: 0.35rem 0.5rem; text-align: center; min-width: 42px; border: 1px solid var(--border); }
    .cm-table th { background: var(--surface2); color: var(--muted); font-weight: 500; font-size: 0.68rem; }
    .cm-cell.diag { font-weight: 600; }

    /* Per-class */
    .pc-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }
    .pc-table th, .pc-table td { padding: 0.4rem 0.5rem; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .pc-table th { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
    .pc-table td:first-child, .pc-table th:first-child { text-align: left; font-weight: 500; }
    .pc-netnum { display: inline-block; min-width: 1.4em; text-align: center; background: var(--surface2); color: var(--muted); border-radius: 3px; font-size: 0.68rem; padding: 0 4px; margin-right: 5px; }
    .recall-cell { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
    .rbar { position: relative; width: 70px; height: 9px; background: var(--bg); border-radius: 2px; overflow: visible; flex: none; }
    .rbar .rfill { position: absolute; left:0; top:0; bottom:0; background: var(--accent3); border-radius: 2px; }
    .rbar .rfill.ns { background: var(--muted); opacity: 0.45; }
    .rbar .rchance { position: absolute; top:-2px; bottom:-2px; width:0; border-left: 2px dashed var(--accent); }
    .star { color: var(--good); font-weight: 600; } .star.ns { color: var(--muted); font-weight: 400; font-style: italic; }

    /* Figures */
    .fig { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .fig img { width: 100%; display: block; }
    .fig .missing { display: flex; align-items: center; justify-content: center; min-height: 150px; color: var(--muted); font-style: italic; font-size: 0.82rem; text-align: center; padding: 1rem; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 750px){ .two-col { grid-template-columns: 1fr; } }
    .expl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 1rem; }

    pre.notes { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.85rem 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--text); overflow-x: auto; margin: 0; }
    .caveat { font-size: 0.78rem; color: var(--muted); font-style: italic; background: var(--bg); border-left: 3px solid var(--warn); padding: 0.55rem 0.85rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; }
    .empty-state { max-width: 1400px; margin: 2rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; }
    .empty-state h3 { font-family: 'Playfair Display', serif; margin: 0 0 0.6rem; }
    .empty-state code { font-family: 'JetBrains Mono', monospace; background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 0.85rem; }
    footer { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem 2rem; color: var(--muted); font-size: 0.74rem; }
    footer code { font-family: 'JetBrains Mono', monospace; background: var(--surface); padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Classification <span class="sub">— Lora Fanda</span></span>
    <span class="draft-badge">DRAFT</span>
    <span class="spacer"></span>
    <select id="runPicker" title="Switch run"></select>
    <a class="guide" id="guideLink" href="#" target="_blank" rel="noopener">Reading guide ↗</a>
    <a class="back" href="moba.html">← MOBA</a>
  </div>

  <div id="app"></div>

  <footer>
    <p>Reads <code id="indexUrl">…</code>. Each run dir holds <code>metrics.json</code>, <code>manifest.json</code>,
      <code>confusion_matrix.csv</code>, <code>per_class_metrics.csv</code>, and the figure PNGs
      (<code>permutation_null</code>, <code>per_class_strength</code>, <code>class_ersp_profile</code>,
      <code>class_feature_heatmap</code>, <code>coef_heatmap</code>, <code>feature_importance</code>).</p>
  </footer>

  <script>
  // ════════════════════════════════════════════════════════════════════════
  //  CONFIG
  // ════════════════════════════════════════════════════════════════════════
  // Outputs are read from this git ref. They must be on it — merge
  // feat/03-fbm-classifying → main, then leave REF = 'main'.
  const REF = 'main';
  const REPO_RAW = `https://raw.githubusercontent.com/lorafanda/Analysis_LoraFanda/${REF}`;
  const CLF_BASE = `${REPO_RAW}/03_FBM_Classifying/outputs/classification`;
  const GUIDE_URL = `https://github.com/lorafanda/Analysis_LoraFanda/blob/${REF}/03_FBM_Classifying/READING_GUIDE.md`;

  // The PRIMARY run leads the page. Pick the representation that has already
  // survived the amplitude confound — not the one that scores highest.
  const PRIMARY = { task: 'condition', variant: 'm101_300', classifier: 'logreg' };

  // Amplitude triad (matched grids) + the full robustness family.
  const TRIAD = {
    300: [['full_300','continuous'], ['full_300_rn','row-normed'], ['m101_300','discretized']],
    30:  [['full_30','continuous'],  ['full_30_rn','row-normed'],  ['m101_30','discretized']],
  };
  const ROBUST_ORDER = ['full_300','full_300_rn','m101_300','hg_300','full_30','full_30_rn','m101_30','hg_30'];
  const YEO7 = {1:'Visual',2:'Somatomotor',3:'DorsAttn',4:'SalVentAttn',5:'Limbic',6:'Control',7:'Default'};

  // ════════════════════════════════════════════════════════════════════════
  //  HELPERS
  // ════════════════════════════════════════════════════════════════════════
  const pct = v => (v==null||isNaN(v)) ? '—' : (v*100).toFixed(1)+'%';
  const f3  = v => (v==null||isNaN(v)) ? '—' : Number(v).toFixed(3);
  const headroom = (ba,ch) => (ba-ch)/(1-ch);   // fraction of the gap-to-perfect captured

  // Verdict colour: significance + CI clearing chance, NEVER an absolute value.
  function verdictClass(o){
    const lo = (o.balanced_accuracy_ci||[])[0];
    const sig = (o.permutation_p!=null && o.permutation_p<0.05);
    if (!sig || (lo!=null && lo<=o.chance_level)) return 'bad';     // not credibly above chance
    return headroom(o.balanced_accuracy,o.chance_level) >= 0.25 ? 'good' : 'warn';
  }
  function barClass(ba,ch,p){
    if (p!=null && p>=0.05) return 'bad';
    return headroom(ba,ch) >= 0.25 ? '' : 'warn';
  }
  function stars(pfdr){
    if (pfdr==null) return '<span class="star ns">·</span>';
    if (pfdr<0.001) return '<span class="star">***</span>';
    if (pfdr<0.01)  return '<span class="star">**</span>';
    if (pfdr<0.05)  return '<span class="star">*</span>';
    return '<span class="star ns">ns</span>';
  }
  function taskLabel(t){
    return t==='condition' ? 'condition (audio / picture / reading)'
      : t==='parcellation_yeo7' ? 'Yeo-7 network' : t==='parcellation_yeo17' ? 'Yeo-17 network' : t;
  }
  function prettyClass(label, task){
    const m = String(label).match(/(\d+)Networks_(\d+)/);
    if (m){ const n=+m[2]; return { chip:String(n), name: (m[1]==='7'?YEO7[n]:'')||'' }; }
    return { chip:'', name:String(label) };
  }
  function parseCSVMatrix(text){
    const rows = text.trim().split(/\r?\n/).map(r=>r.split(','));
    const labels = rows[0].slice(1);
    const cm = rows.slice(1).map(r => r.slice(1).map(Number));
    return { labels, cm };
  }
  async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error(url); return r.json(); }
  async function getText(url){ const r = await fetch(url); if(!r.ok) throw new Error(url); return r.text(); }

  // ════════════════════════════════════════════════════════════════════════
  //  PANEL SHELL  (story order, important first)
  // ════════════════════════════════════════════════════════════════════════
  function panel(id, step, title, bodyHTML){
    return `<section class="panel span2" id="${id}">
      <h2 data-key="${id}"><span class="chev">▾</span><span class="step">${step}</span> ${title}</h2>
      <div class="body">${bodyHTML}</div></section>`;
  }
  function figCard(file, run){
    const url = `${CLF_BASE}/${run.path}/${file}`;
    return `<div class="fig"><img src="${url}" alt="${file}"
      onerror="this.parentNode.innerHTML='<div class=&quot;missing&quot;>${file} — not generated for this run</div>'"></div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  //  RENDER
  // ════════════════════════════════════════════════════════════════════════
  async function loadRun(run, index){
    const app = document.getElementById('app');
    app.innerHTML = '<main><section class="panel span2"><div class="body"><em>loading…</em></div></section></main>';

    let metrics, manifest, conf;
    try {
      [metrics, manifest] = await Promise.all([
        getJSON(`${CLF_BASE}/${run.path}/metrics.json`),
        getJSON(`${CLF_BASE}/${run.path}/manifest.json`),
      ]);
      try { conf = parseCSVMatrix(await getText(`${CLF_BASE}/${run.path}/confusion_matrix.csv`)); } catch { conf=null; }
    } catch(e){ app.innerHTML = emptyState(`Couldn't load this run from <code>${REF}</code>.`); return; }

    const o = metrics.overall, isPrimary = (run.task===PRIMARY.task && run.variant===PRIMARY.variant && run.classifier===PRIMARY.classifier);

    let html = '<main>';

    // ── 1 · VERDICT ───────────────────────────────────────────────────────
    const vc = verdictClass(o), ci = o.balanced_accuracy_ci||[];
    html += panel('verdict','1','The result',
      `<p class="verdict-line">Decoding <b>${taskLabel(run.task)}</b> from the ERSP — <code>${run.variant}</code>, ${run.classifier}.
        ${isPrimary?'<span class="primary-badge">PRIMARY</span>':''}</p>
      <p class="lead"><em>Read it against chance, not against 100%.</em></p>
      <div class="verdict-grid">
        <div class="vtile"><div class="vlabel">Balanced accuracy</div>
          <div class="vbig ${vc}">${pct(o.balanced_accuracy)}</div>
          <div class="vsub">chance ${pct(o.chance_level)} · 95% CI [${pct(ci[0])}, ${pct(ci[1])}]</div></div>
        <div class="vtile"><div class="vlabel">vs chance</div>
          <div class="vbig ${vc}">×${(o.balanced_accuracy/o.chance_level).toFixed(2)}</div>
          <div class="vsub">${(headroom(o.balanced_accuracy,o.chance_level)*100).toFixed(0)}% of the gap</div></div>
        <div class="vtile"><div class="vlabel">Permutation p</div>
          <div class="vbig ${o.permutation_p!=null&&o.permutation_p<0.05?'good':'bad'}">${o.permutation_p==null?'—':o.permutation_p<0.001?'<.001':o.permutation_p.toFixed(3)}</div>
          <div class="vsub">label-shuffled null</div></div>
        <div class="vtile"><div class="vlabel">Generalisation</div>
          <div class="vbig">${o.n_patients}</div>
          <div class="vsub">patients · nested GroupKFold</div></div>
      </div>
      <div class="secondary">secondary — accuracy ${pct(o.accuracy)} · macro-F1 ${f3(o.macro_f1)} · n=${o.n_samples} electrodes</div>`);

    // ── 2 · IS IT REAL ────────────────────────────────────────────────────
    html += panel('real','2','Is it real?',
      `<p class="lead">The dashed line is what label-shuffling gets. <em>If the observed line isn't clear of it, there's nothing here.</em></p>
       ${figCard('permutation_null.png', run)}`);

    // ── 3 · PATTERN OR POWER ──────────────────────────────────────────────
    html += panel('triad','3','Pattern or power?', triadHTML(run, index) +
      `<p class="lead" style="margin-top:1rem">Strong electrodes are easy to find. Strip amplitude to sign only (−1/0/+1) and re-run.
        <em>If the score holds, we're reading the response shape — not its loudness. If it collapses, we were decoding power.</em></p>`);

    // ── 4 · WHAT SEPARATES ────────────────────────────────────────────────
    html += panel('perclass','4','What separates?',
      `<p class="lead">The average hides which classes actually separate. Stars are FDR-corrected against the null.
        <em>A bar with no star is a class we can't tell apart — and we say so.</em> Dashed mark = chance.</p>
       <div class="two-col">
         <div>${perClassTable(metrics.per_class, o.chance_level, run.task)}</div>
         <div>${conf ? confusionHTML(conf, run.task) : '<div class="missing">confusion_matrix.csv not found</div>'}</div>
       </div>`);

    // ── 5 · THE SIGNATURE ─────────────────────────────────────────────────
    html += panel('signature','5','The response signature',
      `<p class="lead">Left of the line is sensing, right is response.
        <em>This is the response itself — not what the model leaned on.</em></p>
       ${figCard('class_ersp_profile.png', run)}`);

    // ── 6 · EXPLORATORY (collapsed) ───────────────────────────────────────
    html += `<section class="panel span2 collapsed" id="expl">
        <h2 data-key="expl"><span class="chev">▾</span><span class="step">6</span> Exploratory — what the model used</h2>
        <div class="body">
          <div class="caveat">Descriptive, not a claim. Correlated bands and heavy regularisation make this ranking soft — don't report it as "these bands drive it."</div>
          <div class="expl-grid">${figCard('class_feature_heatmap.png',run)}${figCard('coef_heatmap.png',run)}${figCard('feature_importance.png',run)}</div>
        </div></section>`;

    // ── 7 · MANIFEST ──────────────────────────────────────────────────────
    html += `<section class="panel span2 collapsed" id="manifest">
        <h2 data-key="manifest"><span class="chev">▾</span><span class="step">7</span> Run config</h2>
        <div class="body"><pre class="notes">${escapeHTML(JSON.stringify({run_id:run.run_id, ...manifest, summary:undefined}, null, 2))}</pre></div></section>`;

    html += '</main>';
    app.innerHTML = html;
    wireCollapse();
  }

  function triadHTML(run, index){
    const find = v => index.find(r => r.task===run.task && r.classifier===run.classifier && r.variant===v);
    let out = '';
    for (const grid of [300,30]){
      out += `<div class="triad-block"><div class="tt">${grid}-time grid</div>`;
      for (const [v,labelTxt] of TRIAD[grid]){
        const e = find(v);
        out += barRow(labelTxt, e, run.variant===v);
      }
      out += '</div>';
    }
    return out;
  }
  function barRow(labelTxt, e, isSel){
    if (!e) return `<div class="bar-row"><span class="blab">${labelTxt}</span><div class="bar-track"></div><span class="bval">—</span></div>`;
    const w = Math.max(0, Math.min(100, e.balanced_accuracy*100));
    const cw = Math.max(0, Math.min(100, e.chance_level*100));
    const cls = barClass(e.balanced_accuracy, e.chance_level, e.permutation_p);
    const sig = (e.permutation_p!=null && e.permutation_p<0.05) ? '' : ' ns';
    return `<div class="bar-row">
      <span class="blab${isSel?' primary':''}">${labelTxt}${isSel?' ◄':''}</span>
      <div class="bar-track"><div class="fill ${cls}" style="width:${w}%"></div><div class="chance" style="left:${cw}%"></div></div>
      <span class="bval"><b>${pct(e.balanced_accuracy)}</b>${sig?' ns':''}</span></div>`;
  }

  function perClassTable(perClass, chance, task){
    if (!perClass || !perClass.length) return '<div class="missing">no per-class metrics</div>';
    let h = `<table class="pc-table"><thead><tr><th>Class</th><th>Recall (vs chance)</th><th>Prec</th><th>F1</th><th>AUC</th><th>n</th><th>sig</th></tr></thead><tbody>`;
    for (const r of perClass){
      const p = prettyClass(r.class, task);
      const chip = p.chip ? `<span class="pc-netnum">${p.chip}</span>` : '';
      const w = Math.max(0,Math.min(100,(r.recall||0)*100)), cw = Math.max(0,Math.min(100,chance*100));
      const isSig = (r.perm_p_fdr!=null && r.perm_p_fdr<0.05);
      const ci = (r.recall_ci_lo!=null) ? `[${(r.recall_ci_lo).toFixed(2)}–${(r.recall_ci_hi).toFixed(2)}]` : '';
      h += `<tr>
        <td>${chip}${p.name||r.class}</td>
        <td><div class="recall-cell"><span class="rbar"><span class="rfill${isSig?'':' ns'}" style="width:${w}%"></span><span class="rchance" style="left:${cw}%"></span></span><span>${(r.recall||0).toFixed(2)} <span style="color:var(--muted)">${ci}</span></span></div></td>
        <td>${(r.precision||0).toFixed(2)}</td><td>${(r.f1||0).toFixed(2)}</td>
        <td>${r.roc_auc_ovr!=null?Number(r.roc_auc_ovr).toFixed(2):'—'}</td>
        <td>${r.support}</td><td>${stars(r.perm_p_fdr)}</td></tr>`;
    }
    return h + '</tbody></table>';
  }

  function confusionHTML(conf, task){
    const { labels, cm } = conf, n=labels.length;
    const rowSums = cm.map(r => r.reduce((a,b)=>a+b,0)||1);
    const short = labels.map(l => { const p=prettyClass(l,task); return p.chip?p.chip:String(l).slice(0,6); });
    let h = '<div class="cm-axis">predicted →</div><table class="cm-table"><thead><tr><th></th>';
    short.forEach(s => h+=`<th>${s}</th>`); h+='</tr></thead><tbody>';
    for (let i=0;i<n;i++){ h+=`<tr><th>${short[i]}</th>`;
      for (let j=0;j<n;j++){ const frac=cm[i][j]/rowSums[i], diag=i===j, a=Math.min(0.85,frac);
        const c = diag?`rgba(94,125,94,${a.toFixed(2)})`:`rgba(184,92,110,${(a*0.7).toFixed(2)})`;
        h+=`<td class="cm-cell ${diag?'diag':''}" style="background:${c}" title="${cm[i][j]} (${(frac*100).toFixed(0)}%)">${(frac*100).toFixed(0)}</td>`; }
      h+='</tr>'; }
    return h+'</tbody></table><div class="cm-axis">row = true · cells = % of true class</div>';
  }

  function escapeHTML(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function emptyState(msg){
    return `<div class="empty-state"><h3>No runs on <code>${REF}</code> yet</h3>
      <p>${msg||''}</p>
      <p>Run <code>320</code> / <code>330</code> in <code>03_FBM_Classifying</code>, then merge
      <code>feat/03-fbm-classifying → main</code> so the figures resolve. The page reads
      <code>${CLF_BASE}/index.json</code>.</p></div>`;
  }

  // ── Collapse (persisted) ──
  function wireCollapse(){
    const KEY='clf_collapsed_v2'; let set;
    try { set = new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); } catch { set=new Set(); }
    document.querySelectorAll('section.panel h2').forEach(h2=>{
      const k=h2.dataset.key, panel=h2.closest('section.panel');
      if (set.has(k)) panel.classList.add('collapsed');
      h2.addEventListener('click',()=>{ panel.classList.toggle('collapsed');
        panel.classList.contains('collapsed')?set.add(k):set.delete(k);
        localStorage.setItem(KEY,JSON.stringify([...set])); });
    });
  }

  // ── Run picker, grouped + primary-first ──
  function fillPicker(index){
    const picker = document.getElementById('runPicker'); picker.innerHTML='';
    const score = r => (r.task===PRIMARY.task && r.variant===PRIMARY.variant && r.classifier===PRIMARY.classifier) ? 0 : 1;
    const sorted = [...index].sort((a,b)=> score(a)-score(b) || a.task.localeCompare(b.task) || a.variant.localeCompare(b.variant) || a.classifier.localeCompare(b.classifier));
    for (const r of sorted){
      const o=document.createElement('option'); o.value=r.path;
      const star = score(r)===0?'★ ':'';
      o.textContent = `${star}${r.task} · ${r.variant} · ${r.classifier}`;
      picker.appendChild(o);
    }
    return sorted;
  }

  // ── Boot ──
  (async function(){
    document.getElementById('guideLink').href = GUIDE_URL;
    document.getElementById('indexUrl').textContent = `${CLF_BASE}/index.json`;
    let index;
    try { const idx = await getJSON(`${CLF_BASE}/index.json`); index = idx.runs||idx; }
    catch(e){ document.getElementById('app').innerHTML = emptyState('Index not reachable.'); return; }
    if (!index || !index.length){ document.getElementById('app').innerHTML = emptyState('Index is empty.'); return; }
    // keep latest run per (task,variant,classifier)
    const latest = {};
    for (const r of index){ const k=`${r.task}|${r.variant}|${r.classifier}`; if(!latest[k]||r.created_at>latest[k].created_at) latest[k]=r; }
    index = Object.values(latest);
    const sorted = fillPicker(index);
    const picker = document.getElementById('runPicker');
    picker.addEventListener('change', e => { const r = index.find(x=>x.path===e.target.value); if(r) loadRun(r, index); });
    loadRun(sorted[0], index);   // primary first
  })();
  </script>
</body>
</html>
