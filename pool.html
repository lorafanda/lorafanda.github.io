<!DOCTYPE html>
<!--
  POOL — functional-role brain map. Sibling of MOBA (moba.html / moba.js).
  Mirrors MOBA's working renderer EXACTLY: Niivue UMD 0.69, fsaverage .mz3 meshes,
  electrodes BAKED INTO OBJ sphere meshes (one mesh per colour×depth group) — MOBA
  avoids Niivue connectomes (blank on the ANGLE/Metal GPU).

  Filters: ROLE + PATIENT (MOBA parity). Cortical vs depth electrodes get MOBA's
  radii (2.52mm α255 / 1.65mm α180). NOTE on condition: POOL contacts are ONE ROW
  PER CONTACT, collapsed across audio/picture/reading (the role *is* the cross-
  condition pattern), so a per-condition filter does not apply here.

  DATA (04_FBM_Pooling/460 -> lf_pool.export_pool_web, committed under
  04_FBM_Pooling/outputs/pooling/pool_web/):
    contacts_pool.csv : patient,contact,name,hemi,x,y,z,is_cortical,role,roles_matched,color
    pool_index.json   : { grid, n_contacts, csv, roles:[{role,color,n}] }
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>POOL — functional-role brain map</title>
<script src="https://unpkg.com/@niivue/niivue@0.69.0/dist/niivue.umd.js"></script>
<style>
  :root { --bg:#fff; --panel:#f4f5f7; --fg:#1c2330; --muted:#6b7280; --line:#e3e6eb; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #wrap { display:grid; grid-template-columns:280px 1fr; height:100vh; }
  #side { background:var(--panel); padding:14px 16px; overflow:auto; border-right:1px solid var(--line); }
  #side h1 { font-size:19px; margin:0 0 2px; }
  #side .sub { color:var(--muted); font-size:12px; margin-bottom:8px; }
  #side h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
             margin:16px 0 6px; display:flex; align-items:center; gap:8px; }
  .role { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px; cursor:pointer; }
  .role input { accent-color:#2563eb; }
  .swatch { width:14px; height:14px; border-radius:3px; flex:0 0 auto; border:1px solid #0002; }
  .count { margin-left:auto; color:var(--muted); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:999px;
          background:#fff; cursor:pointer; user-select:none; }
  .chip.off { opacity:.4; text-decoration:line-through; }
  .mini { font-size:11px; padding:2px 7px; }
  #status { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.5; }
  .na { color:var(--muted); font-size:11px; font-style:italic; margin-top:4px; }
  #main { display:flex; flex-direction:column; min-height:0; height:100vh; }
  #gl { width:100%; flex:1 1 auto; min-height:0; display:block; }
  #samples { flex:0 0 218px; border-top:1px solid var(--line); background:var(--panel);
             overflow-x:auto; overflow-y:hidden; white-space:nowrap; padding:8px; }
  #samples .shead { font-size:11px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--muted); margin:0 0 6px 2px; }
  #samples .row { display:flex; gap:8px; align-items:flex-start; }
  .scard { flex:0 0 auto; width:172px; background:#fff; border:1px solid var(--line);
           border-radius:7px; padding:6px 7px; }
  .scard .lab { font-size:11px; line-height:1.3; margin-bottom:5px; white-space:normal; }
  .scard .lab b { font-size:12px; }
  .scard .imgs { display:flex; gap:3px; }
  .scard .imgs > div { text-align:center; }
  .scard img { width:50px; height:auto; display:block; border:1px solid var(--line);
               border-radius:3px; background:#fff; }
  .scard .cond { font-size:8px; color:var(--muted); margin-top:1px; }
  #samples .empty { color:var(--muted); font-size:12px; padding:10px; font-style:italic; }
  button { background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:4px 9px; font-size:12px; cursor:pointer; }
  button:hover { background:#eef1f5; }
</style>
</head>
<body>
<div id="wrap">
  <aside id="side">
    <h1>POOL</h1>
    <div class="sub">Functional-role activity on fsaverage</div>

    <h2>Roles <button id="rolesAll" class="mini">all</button><button id="rolesNone" class="mini">none</button></h2>
    <div id="roles"></div>

    <h2>Patients <button id="patAll" class="mini">all</button><button id="patNone" class="mini">none</button></h2>
    <div id="patients" class="chips"></div>

    <h2>Condition</h2>
    <div class="na">n/a — POOL contacts are collapsed across audio·picture·reading
       (the role is the cross-condition pattern).</div>

    <div id="status">loading…</div>
  </aside>
  <div id="main">
    <canvas id="gl"></canvas>
    <div id="samples"></div>
  </div>
</div>

<script>
// ============================ CONFIG — matches moba.js ============================
const BRANCH   = "main";
const REPO_RAW = `https://raw.githubusercontent.com/lorafanda/Analysis_LoraFanda/${BRANCH}`;
const FSAV_MESH_BASE = `${REPO_RAW}/02_FBM_Clustering/outputs/250_recon/fsaverage/meshes`;
const POOL_BASE      = `${REPO_RAW}/04_FBM_Pooling/outputs/pooling/pool_web`;
const POOL_INDEX = `${POOL_BASE}/pool_index.json`;
const POOL_CSV   = `${POOL_BASE}/contacts_pool.csv`;
const POOL_SAMPLES = `${POOL_BASE}/pool_samples.json`;   // per-contact ERSP image paths (460 export)
const MESH_RGBA  = [205, 198, 190, 30];                       // bone, translucent (MOBA)
const RADII = { cortical:{ r:2.52, a:255 }, depth:{ r:1.65, a:180 } };  // MOBA radii
// =================================================================================

const statusEl = document.getElementById("status");
const setStatus = (m) => (statusEl.textContent = m);
const hexToRgb = (h) => { const n = parseInt(String(h).replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };

// ---------- icosphere (42v / 80f) ----------
function buildIcosphere() {
  const t = (1 + Math.sqrt(5)) / 2;
  let verts = [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],
               [0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]]
              .map(v => { const L = Math.hypot(...v); return [v[0]/L,v[1]/L,v[2]/L]; });
  let faces = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
               [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const mid = new Map();
  const midpoint = (a,b) => { const key = a<b?`${a}_${b}`:`${b}_${a}`;
    if (mid.has(key)) return mid.get(key);
    const va=verts[a], vb=verts[b]; let m=[(va[0]+vb[0])/2,(va[1]+vb[1])/2,(va[2]+vb[2])/2];
    const L=Math.hypot(...m); m=[m[0]/L,m[1]/L,m[2]/L]; const idx=verts.push(m)-1; mid.set(key,idx); return idx; };
  const f2 = [];
  for (const [a,b,c] of faces) { const ab=midpoint(a,b), bc=midpoint(b,c), ca=midpoint(c,a);
    f2.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]); }
  return { verts, faces: f2 };
}
const SPHERE = buildIcosphere();
function buildSpheresOBJ(pts, radius) {
  const out = [`# POOL · ${pts.length} spheres · r=${radius}mm`];
  for (const e of pts) for (const v of SPHERE.verts)
    out.push(`v ${(e.x+v[0]*radius).toFixed(3)} ${(e.y+v[1]*radius).toFixed(3)} ${(e.z+v[2]*radius).toFixed(3)}`);
  out.push("vn 0 0 1");
  for (let i=0;i<pts.length;i++){ const off=i*SPHERE.verts.length+1;
    for (const f of SPHERE.faces) out.push(`f ${f[0]+off}//1 ${f[1]+off}//1 ${f[2]+off}//1`); }
  return out.join("\n") + "\n";
}

// ---------- data ----------
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/); const head = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(line => { const c=line.split(","); const o={};
    head.forEach((h,i)=> o[h]=(c[i]??"").trim()); return o; });
}

let CONTACTS = [], ROLES = [], PATIENTS = [], SAMPLES = {};
const enabledRoles = new Set(), enabledPatients = new Set();
let nv = null, _timer = null;

const roleColor = (role) => (ROLES.find(r=>r.role===role)?.color) || "#888888";
const depthClass = (c) => { const v = c.is_cortical;            // export writes "1.0"/"0.0"
  if (v === undefined || v === "") return "cortical";
  return (parseFloat(v) >= 0.5) ? "cortical" : "depth"; };
const isVisible = (c) => enabledRoles.has(c.role) && enabledPatients.has(c.patient);

async function renderElectrodes() {
  for (const m of [...nv.meshes]) if (String(m.name||"").startsWith("electrodes_")) nv.removeMesh(m);
  const groups = new Map();                              // "role|class" -> [{x,y,z}]
  for (const c of CONTACTS) {
    if (!isVisible(c)) continue;
    const key = c.role + "|" + depthClass(c);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ x:+c.x, y:+c.y, z:+c.z });
  }
  let shown = 0;
  for (const [key, pts] of groups) {
    if (!pts.length) continue;
    const [role, cls] = key.split("|");
    const [r,g,b] = hexToRgb(roleColor(role));
    const { r:rad, a:alpha } = RADII[cls] || RADII.cortical;
    const url = URL.createObjectURL(new Blob([buildSpheresOBJ(pts, rad)], { type:"text/plain" }));
    const mesh = await nv.addMeshFromUrl({ url, name:`electrodes_${role}_${cls}.obj`, rgba255:[r,g,b,alpha] });
    try { nv.setMeshShader(mesh.id, "Flat"); } catch(e) {}
    URL.revokeObjectURL(url);
    shown += pts.length;
  }
  nv.drawScene();
  setStatus(`${shown} / ${CONTACTS.length} contacts shown`);
  renderSamples();
}

// ---------- samples strip (the visible contacts' ERSPs, MOBA-style) ----------
const CONDS = ["audio", "picture", "reading"];
function renderSamples() {
  const el = document.getElementById("samples");
  const vis = CONTACTS.filter(isVisible);
  if (!Object.keys(SAMPLES).length) {
    el.innerHTML = `<div class="empty">No sample images yet — re-run notebook 460 (the export now writes
      <code>pool_samples.json</code>), then refresh.</div>`;
    return;
  }
  const CAP = 300;                                  // lazy-loaded; cap keeps the DOM sane
  const show = vis.slice(0, CAP);
  let h = `<div class="shead">${vis.length} contact(s) in the selected pool(s)</div><div class="row">`;
  for (const c of show) {
    const imgs = SAMPLES[`${c.patient}|${c.contact}`] || {};
    let cells = "";
    for (const cond of CONDS) {
      if (!imgs[cond]) continue;
      cells += `<div><img loading="lazy" src="${REPO_RAW}/${imgs[cond]}" alt="${cond}"
                  onerror="this.style.display='none'"><div class="cond">${cond.slice(0,3)}</div></div>`;
    }
    h += `<div class="scard"><div class="lab"><b>${c.contact}</b> · ${c.patient}
            <br><span style="color:${roleColor(c.role)}">${c.role}</span></div>
            <div class="imgs">${cells || '<span class="cond">no ERSP</span>'}</div></div>`;
  }
  h += `</div>`;
  if (vis.length > CAP) h += `<div class="empty">+${vis.length - CAP} more — narrow the role/patient filters to see them.</div>`;
  el.innerHTML = h;
}
function rerender() { clearTimeout(_timer); _timer = setTimeout(renderElectrodes, 30); }

// ---------- legends ----------
function buildRoleLegend() {
  const el = document.getElementById("roles"); el.innerHTML = "";
  for (const r of ROLES) {
    const on = r.role !== "none";          // hide the unmatched 'none' contacts by default
    if (on) enabledRoles.add(r.role);
    const row = document.createElement("label"); row.className = "role";
    const cb = document.createElement("input"); cb.type="checkbox"; cb.checked=on;
    cb.onchange = () => { cb.checked ? enabledRoles.add(r.role) : enabledRoles.delete(r.role); rerender(); };
    const sw = document.createElement("span"); sw.className="swatch"; sw.style.background=r.color;
    const tx = document.createElement("span"); tx.textContent=r.role;
    const ct = document.createElement("span"); ct.className="count"; ct.textContent=r.n ?? "";
    row.append(cb, sw, tx, ct); el.append(row);
  }
}
function buildPatientChips() {
  const el = document.getElementById("patients"); el.innerHTML = "";
  for (const p of PATIENTS) {
    enabledPatients.add(p);
    const chip = document.createElement("span"); chip.className="chip"; chip.textContent=p;
    chip.onclick = () => { if (enabledPatients.has(p)) { enabledPatients.delete(p); chip.classList.add("off"); }
                           else { enabledPatients.add(p); chip.classList.remove("off"); } rerender(); };
    el.append(chip);
  }
}
const setAllRoles = (on) => { ROLES.forEach(r => on?enabledRoles.add(r.role):enabledRoles.delete(r.role));
  document.querySelectorAll("#roles input").forEach(c=>c.checked=on); rerender(); };
const setAllPatients = (on) => { PATIENTS.forEach(p => on?enabledPatients.add(p):enabledPatients.delete(p));
  document.querySelectorAll("#patients .chip").forEach(c=>c.classList.toggle("off", !on)); rerender(); };
document.getElementById("rolesAll").onclick  = () => setAllRoles(true);
document.getElementById("rolesNone").onclick = () => setAllRoles(false);
document.getElementById("patAll").onclick    = () => setAllPatients(true);
document.getElementById("patNone").onclick   = () => setAllPatients(false);

// ---------- boot ----------
(async () => {
  try {
    const supportsWebGPU = !!navigator.gpu;
    nv = new niivue.Niivue({ backColor:[1,1,1,1], show3Dcrosshair:false, isOrientCube:false,
                             isResizeCanvas:true, isColorbar:false, meshXRay:0,
                             isHighResolutionCapable:true, useWebGPU:supportsWebGPU });
    await nv.attachToCanvas(document.getElementById("gl"));

    setStatus("loading brain meshes…");
    // niivue 0.69 chokes on the gzipped .mz3 ("Invalid MZ3"); fall back to .gii
    // exactly like MOBA's loadBrainSurfaceMeshes does.
    const meshUrls = [`${FSAV_MESH_BASE}/fsaverage_lh.mz3`, `${FSAV_MESH_BASE}/fsaverage_rh.mz3`];
    try {
      await nv.loadMeshes(meshUrls.map(u => ({ url:u, rgba255:MESH_RGBA, visible:true })));
    } catch (e) {
      await nv.loadMeshes(meshUrls.map(u => ({ url:u.replace(".mz3",".gii"), rgba255:MESH_RGBA, visible:true })));
    }

    setStatus("loading pool data…");
    let idx = {}; try { idx = await (await fetch(POOL_INDEX)).json(); } catch(e) {}
    CONTACTS = parseCSV(await (await fetch(POOL_CSV)).text()).filter(c => c.x && c.y && c.z);
    try { SAMPLES = await (await fetch(POOL_SAMPLES)).json(); } catch (e) { SAMPLES = {}; }
    ROLES = (idx.roles && idx.roles.length) ? idx.roles : (() => {
      const seen = new Map(); CONTACTS.forEach(c => { if (!seen.has(c.role)) seen.set(c.role, c.color); });
      return [...seen].map(([role,color]) => ({ role, color, n: CONTACTS.filter(x=>x.role===role).length }));
    })();
    PATIENTS = [...new Set(CONTACTS.map(c => c.patient))].sort();
    buildRoleLegend(); buildPatientChips();
    await renderElectrodes();
  } catch (e) {
    setStatus("⚠️ " + e.message + "  (check REPO_RAW / branch / data paths)");
    console.error(e);
  }
})();
</script>
</body>
</html>
